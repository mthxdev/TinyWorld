name: iOS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate
        working-directory: TinyWorld

      - name: Build unsigned IPA
        run: |
          xcodebuild -project TinyWorld.xcodeproj \
            -scheme TinyWorld \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT=$PWD/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
          
          # Convert app to ipa
          mkdir -p Payload
          mv build/Release-iphoneos/TinyWorld.app Payload/
          zip -r TinyWorld.ipa Payload
          
          echo "==== IPA CONTENTS ===="
          unzip -l TinyWorld.ipa
          echo "==== MACH-O INFO ===="
          lipo -info Payload/TinyWorld.app/TinyWorld || true
          echo "======================"
        working-directory: TinyWorld

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyWorld-IPA
          path: TinyWorld/TinyWorld.ipa
