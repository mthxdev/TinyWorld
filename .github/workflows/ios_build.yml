name: iOS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate
        working-directory: TinyWorld

      - name: Build unsigned IPA
        run: |
          xcodebuild -project TinyWorld.xcodeproj \
            -scheme TinyWorld \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath TinyWorld.xcarchive
          
          # Convert archive to ipa
          mkdir -p Payload
          mv TinyWorld.xcarchive/Products/Applications/TinyWorld.app Payload/
          zip -r TinyWorld.ipa Payload
        working-directory: TinyWorld

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyWorld-IPA
          path: TinyWorld/TinyWorld.ipa
